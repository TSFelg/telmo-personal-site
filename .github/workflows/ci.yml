name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check formatting of project customizations
        run: pnpm exec prettier --check data tests scripts README.md .github/workflows src/components/Header.astro src/components/Footer.astro src/components/TalkList.astro src/utils/talks.ts src/styles/personal.css
      - run: pnpm build
      - name: Verify a root-domain deployment
        run: pnpm build
        env:
          SITE_URL: https://example.com/
